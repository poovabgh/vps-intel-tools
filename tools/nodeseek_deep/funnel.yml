  - 线路
  - 评测
  - 风险

# 短期话题：优惠/推广/抢购/交易/溢价/拼车/抽奖
# 默认可 L1 入库，打时间窗，不上 L3（除非正文/评论强命中 L3 密度）
trade_title_patterns:
  - ^【?收】
  - ^【?出】
  - 已出
  - 秒出
  - 人找车
  - 收台
  - 折出
  - 溢价收

