  - 去程
  - \bASN\b
  - 丢包
  - 晚高峰
  - IP质量
  - 软银.*(互联|上游|体感|和NTT)
  - IIJ
  - NTT.*(路径|体感|一样)
  - 9929.*(好|稳|比)
  - 4837.*(好|稳|比|美西)
  - CN2GIA|CN2 GIA|强制CN2
  - 电信.*(9929|4837|CN2)
  - 联通.*(9929|4837)
  - 移动.*(CMIN2|CMI)
  - 精品BGP
  - 普通BGP
  - 国际互联
  - 超售
  - 被打
  - 炸
  - 解锁
  - ChatGPT|OpenAI|Claude|Gemini
  - TikTok|Reddit|Twitter|社媒
  - 原生IP|家宽广播|送中|风险分
  - YABS|Geekbench|IOPS|并发
  - 建站.*(回程|带宽|延迟)
  - NodeQuality|TCPQuality|\bNQ\b|\bTQ\b
  - IX专线|伪IEPL|前海IX
  - 沪港.?[Ii][Xx]|深港.?[Ii][Xx]
