# L3 最少门槛（满足其一）
l3_min_comment_chars: 80
l3_min_op_chars: 120
l3_require_density_hit: true

# 多页抓取
max_pages: 3
page_sleep_sec: 0.9

# 证据 markdown 每楼截断（thread.json 仍可存全文）
evidence_floor_max_chars: 4000
