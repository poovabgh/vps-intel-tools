# NodeSeek 深读三层漏斗规则（白话可改）
# L1：服务器相关（RSS keep 已过；此处再挡噪音）
# L2：长期三话题学习向 → 升档关注正文/评论信息密度
#     1) routing 线路机  2) ip-quality IP质量  3) hosting 建站机
# L3：高价值原文归档（完整正文+多页评论+raw HTML）
# 短期：优惠/推广/抢购/交易/溢价/拼车/抽奖 → 可 L1，打时间窗，不轻易 L3

version: 2

l1_noise_title:
  - 灵车
  - Claude封号
  - GPT封号
  - 极简探针
  - YouTube的测速机制
  - Google Play.*GC折扣
  - 自动回帖.*机器人

