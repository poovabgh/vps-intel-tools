# NodeSeek 电报索引关键词库（keywords.yml）
#
# 【重点词】priority.brands + priority.strong_signals
#   重点观测品牌、NQ/TQ、测试留档、快乐鸡、家宽、线路代号等 —— 命中即倾向保留；深读优先排进重点批次
# 【通用词】general.brands
#   通用名单品牌（次要观测）—— 命中也会 keep，但标记 catalog:general，不与重点观测名单混排
# 【常规词】regular.generic + regular.trade_context
#   VPS/服务器/NAT/年付/出收标记等 —— 权重累加，达到 keep_threshold 才保留
# 【噪声词】noise
#   GPT/Claude账号、手表、社保等 —— 噪声强且服务器分不足则丢弃
#
# 光帆 = AWS Lightsail，词条 tag 为 brand:aws（不再用独立 brand:guangfan）
# version 见下方字段。说明见 KEYWORD_ROUTER.md 与 docs/brands-priority.md / docs/brands-general.md
#
